<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .actor-label { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
      .uc-label { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 11px; fill: #0f172a; font-weight: 500; text-anchor: middle; }
      .uc-id { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 9px; fill: #2563eb; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background Box -->
  <rect width="900" height="600" fill="#f8fafc" rx="8" />
  <text x="30" y="30" class="title">NovaBank Personal Loan Origination — Use Case Model</text>
  <text x="30" y="48" font-family="sans-serif" font-size="11" fill="#64748b">Fictional portfolio case study — not real bank data</text>

  <!-- System Boundary Box -->
  <rect x="220" y="65" width="460" height="515" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" rx="8" />
  <text x="240" y="88" font-family="sans-serif" font-size="12" font-weight="700" fill="#475569">System: Loan Origination Engine</text>

  <!-- Left Actors: Customer, RM, Branch Ops -->
  <!-- Customer -->
  <circle cx="90" cy="140" r="16" fill="#e2e8f0" stroke="#475569" stroke-width="1.5" />
  <line x1="90" y1="156" x2="90" y2="190" stroke="#475569" stroke-width="1.5" />
  <line x1="65" y1="170" x2="115" y2="170" stroke="#475569" stroke-width="1.5" />
  <line x1="90" y1="190" x2="70" y2="225" stroke="#475569" stroke-width="1.5" />
  <line x1="90" y1="190" x2="110" y2="225" stroke="#475569" stroke-width="1.5" />
  <text x="90" y="245" class="actor-label">Retail Customer</text>

  <!-- Branch RM -->
  <circle cx="90" cy="350" r="16" fill="#e2e8f0" stroke="#475569" stroke-width="1.5" />
  <line x1="90" y1="366" x2="90" y2="400" stroke="#475569" stroke-width="1.5" />
  <line x1="65" y1="380" x2="115" y2="380" stroke="#475569" stroke-width="1.5" />
  <line x1="90" y1="400" x2="70" y2="435" stroke="#475569" stroke-width="1.5" />
  <line x1="90" y1="400" x2="110" y2="435" stroke="#475569" stroke-width="1.5" />
  <text x="90" y="455" class="actor-label">Branch RM / Ops</text>

  <!-- Right Actors: Underwriter, Compliance, Core Banking -->
  <!-- Underwriter -->
  <circle cx="810" cy="140" r="16" fill="#e2e8f0" stroke="#475569" stroke-width="1.5" />
  <line x1="810" y1="156" x2="810" y2="190" stroke="#475569" stroke-width="1.5" />
  <line x1="785" y1="170" x2="835" y2="170" stroke="#475569" stroke-width="1.5" />
  <line x1="810" y1="190" x2="790" y2="225" stroke="#475569" stroke-width="1.5" />
  <line x1="810" y1="190" x2="830" y2="225" stroke="#475569" stroke-width="1.5" />
  <text x="810" y="245" class="actor-label">Credit Underwriter</text>

  <!-- Compliance Analyst -->
  <circle cx="810" cy="300" r="16" fill="#e2e8f0" stroke="#475569" stroke-width="1.5" />
  <line x1="810" y1="316" x2="810" y2="350" stroke="#475569" stroke-width="1.5" />
  <line x1="785" y1="330" x2="835" y2="330" stroke="#475569" stroke-width="1.5" />
  <line x1="810" y1="350" x2="790" y2="385" stroke="#475569" stroke-width="1.5" />
  <line x1="810" y1="350" x2="830" y2="385" stroke="#475569" stroke-width="1.5" />
  <text x="810" y="405" class="actor-label">KYC / Compliance</text>

  <!-- Core Banking Service -->
  <rect x="760" y="475" width="100" height="50" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="1.5" />
  <text x="810" y="498" class="actor-label">&lt;&lt;System&gt;&gt;</text>
  <text x="810" y="514" class="actor-label">Core Banking API</text>

  <!-- Use Case Ellipses -->
  <!-- UC-01 -->
  <ellipse cx="330" cy="130" rx="80" ry="25" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="330" y="125" class="uc-id">UC-01</text>
  <text x="330" y="139" class="uc-label">Submit Application</text>

  <!-- UC-02 -->
  <ellipse cx="330" cy="200" rx="80" ry="25" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="330" y="195" class="uc-id">UC-02</text>
  <text x="330" y="209" class="uc-label">Upload Documents</text>

  <!-- UC-03 -->
  <ellipse cx="550" cy="130" rx="85" ry="25" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" />
  <text x="550" y="125" class="uc-id" fill="#16a34a">UC-03 (Auto)</text>
  <text x="550" y="139" class="uc-label">Pre-Validate Docs</text>

  <!-- UC-04 -->
  <ellipse cx="550" cy="200" rx="85" ry="25" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="550" y="195" class="uc-id">UC-04 / UC-05</text>
  <text x="550" y="209" class="uc-label">Verify KYC & Bureau</text>

  <!-- UC-06 -->
  <ellipse cx="550" cy="280" rx="85" ry="25" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" />
  <text x="550" y="275" class="uc-id" fill="#854d0e">UC-06 (Auto)</text>
  <text x="550" y="289" class="uc-label">Execute STP Decision</text>

  <!-- UC-07 -->
  <ellipse cx="550" cy="360" rx="85" ry="25" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
  <text x="550" y="355" class="uc-id" fill="#b91c1c">UC-07</text>
  <text x="550" y="369" class="uc-label">Underwrite Exception</text>

  <!-- UC-08 -->
  <ellipse cx="330" cy="290" rx="80" ry="25" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="330" y="285" class="uc-id">UC-08</text>
  <text x="330" y="299" class="uc-label">Track Status 24/7</text>

  <!-- UC-10 -->
  <ellipse cx="330" cy="380" rx="80" ry="25" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="330" y="375" class="uc-id">UC-10</text>
  <text x="330" y="389" class="uc-label">Sign Digital Agreement</text>

  <!-- UC-12 -->
  <ellipse cx="550" cy="460" rx="85" ry="25" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" />
  <text x="550" y="455" class="uc-id" fill="#16a34a">UC-12 (Auto)</text>
  <text x="550" y="469" class="uc-label">Disburse Loan Funds</text>

  <!-- Connecting Lines -->
  <!-- Customer to UCs -->
  <line x1="120" y1="160" x2="250" y2="135" stroke="#64748b" stroke-width="1.2" />
  <line x1="120" y1="170" x2="250" y2="200" stroke="#64748b" stroke-width="1.2" />
  <line x1="120" y1="180" x2="250" y2="285" stroke="#64748b" stroke-width="1.2" />
  <line x1="120" y1="190" x2="250" y2="375" stroke="#64748b" stroke-width="1.2" />

  <!-- Branch RM to UC-01, UC-02 -->
  <line x1="120" y1="380" x2="255" y2="145" stroke="#64748b" stroke-width="1.2" stroke-dasharray="2,2" />
  <line x1="120" y1="390" x2="252" y2="210" stroke="#64748b" stroke-width="1.2" stroke-dasharray="2,2" />

  <!-- Underwriter to UC-07 -->
  <line x1="770" y1="160" x2="635" y2="350" stroke="#64748b" stroke-width="1.2" />

  <!-- Compliance to UC-04 -->
  <line x1="770" y1="320" x2="635" y2="215" stroke="#64748b" stroke-width="1.2" />

  <!-- Core Banking to UC-12 -->
  <line x1="760" y1="495" x2="635" y2="470" stroke="#64748b" stroke-width="1.2" />
</svg>
