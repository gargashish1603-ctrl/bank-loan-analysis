<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 12px; fill: #10b981; font-weight: 600; }
      .swimlane-label { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
      .node-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 11px; fill: #064e3b; font-weight: 600; }
      .node-subtext { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 9px; fill: #047857; }
      .manual-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 11px; fill: #7f1d1d; font-weight: 600; }
      .manual-subtext { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 9px; fill: #991b1b; }
      .tag-stp { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 9px; font-weight: 700; fill: #854d0e; }
      .edge-label { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 9px; fill: #047857; font-weight: 600; }
    </style>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3b82f6" />
    </marker>
  </defs>

  <!-- Header -->
  <rect width="1000" height="650" fill="#f8fafc" rx="8" />
  <text x="30" y="35" class="title">NovaBank — TO-BE Optimized Process (Automation-First, Exception-Based: 1.8 Days TAT)</text>
  <text x="30" y="55" class="subtitle">Illustrative assumptions for portfolio case study — not real bank data | Green nodes = Automated STP | Red nodes = Exception Underwriting</text>

  <!-- Swimlane Backgrounds -->
  <!-- Lane 1: Customer (Self-Service) -->
  <rect x="20" y="70" width="960" height="95" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <rect x="20" y="70" width="140" height="95" fill="#f0fdf4" stroke="#dcfce7" />
  <text x="30" y="115" class="swimlane-label">1. Customer (Digital)</text>
  <text x="30" y="130" font-family="sans-serif" font-size="9" fill="#16a34a">Self-Service Hub</text>

  <!-- Lane 2: Intake & Pre-Validation Engine -->
  <rect x="20" y="165" width="960" height="95" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <rect x="20" y="165" width="140" height="95" fill="#f0fdf4" stroke="#dcfce7" />
  <text x="30" y="210" class="swimlane-label">2. Automated Ingestion</text>
  <text x="30" y="225" font-family="sans-serif" font-size="9" fill="#16a34a">OCR & Resolution Check</text>

  <!-- Lane 3: Automated KYC & Bureau APIs -->
  <rect x="20" y="260" width="960" height="95" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <rect x="20" y="260" width="140" height="95" fill="#f0fdf4" stroke="#dcfce7" />
  <text x="30" y="305" class="swimlane-label">3. Automated Compliance</text>
  <text x="30" y="320" font-family="sans-serif" font-size="9" fill="#16a34a">National ID & Watchlist</text>

  <!-- Lane 4: Decision Engine & Underwriting -->
  <rect x="20" y="355" width="960" height="155" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <rect x="20" y="355" width="140" height="155" fill="#f0fdf4" stroke="#dcfce7" />
  <text x="30" y="415" class="swimlane-label">4. Decisioning & Risk</text>
  <text x="30" y="430" font-family="sans-serif" font-size="9" fill="#16a34a">STP vs. Human Desk</text>

  <!-- Lane 5: Agreement & Core Banking API -->
  <rect x="20" y="510" width="960" height="110" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <rect x="20" y="510" width="140" height="110" fill="#f0fdf4" stroke="#dcfce7" />
  <text x="30" y="565" class="swimlane-label">5. Core Banking Rails</text>
  <text x="30" y="580" font-family="sans-serif" font-size="9" fill="#16a34a">Instant Disbursement</text>

  <!-- Nodes & Process Flow -->
  <!-- Step 1: Customer Form -->
  <rect x="180" y="85" width="115" height="60" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" />
  <text x="190" y="105" class="node-text">Digital Form Entry</text>
  <text x="190" y="120" class="node-subtext">Real-time validation</text>
  <text x="190" y="133" class="node-subtext">Dynamic Checklist</text>

  <!-- Step 2: Automated Upload & Pre-validation -->
  <rect x="180" y="180" width="115" height="60" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" />
  <text x="190" y="200" class="node-text">Instant Pre-Check</text>
  <text x="190" y="215" class="node-subtext">DPI ≥ 300 / Format OK</text>
  <text x="190" y="228" font-family="sans-serif" font-size="9" font-weight="700" fill="#047857">Rework: 35% → 8%</text>

  <!-- Step 3: Automated KYC & Bureau -->
  <rect x="330" y="275" width="130" height="60" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" />
  <text x="340" y="295" class="node-text">Automated Registry</text>
  <text x="340" y="310" class="node-subtext">National ID API & AML</text>
  <text x="340" y="323" class="node-subtext">Credit Bureau Pull (3s)</text>

  <!-- Gateway: Decisioning Engine Segmentation -->
  <polygon points="530,390 570,355 610,390 570,425" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" />
  <text x="548" y="393" font-family="sans-serif" font-size="10" font-weight="700" fill="#854d0e">Risk Tier?</text>

  <!-- Branch A: Tier 1 STP Auto-Approval -->
  <rect x="645" y="365" width="145" height="55" rx="6" fill="#fef08a" stroke="#eab308" stroke-width="2" />
  <text x="655" y="385" class="tag-stp">★ AUTOMATED STP PASS ★</text>
  <text x="655" y="400" font-family="sans-serif" font-size="9" fill="#713f12">Score ≥ 750 / DTI ≤ 35%</text>
  <text x="655" y="412" font-family="sans-serif" font-size="9" font-weight="700" fill="#15803d">38% Straight-Through (<10s)</text>

  <!-- Branch B: Tier 2 Exception Underwriting -->
  <rect x="500" y="445" width="140" height="55" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
  <text x="510" y="465" class="manual-text">Underwriter Workbench</text>
  <text x="510" y="480" class="manual-subtext">Complex/High-Ticket Files</text>
  <text x="510" y="492" class="manual-subtext">Pre-calculated ratios</text>

  <!-- Step 4: Digital Sanction & e-Sign -->
  <rect x="645" y="85" width="145" height="60" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" />
  <text x="655" y="105" class="node-text">Mobile OTP e-Sign</text>
  <text x="655" y="120" class="node-subtext">Instant Digital Sanction</text>
  <text x="655" y="133" font-family="sans-serif" font-size="9" font-weight="700" fill="#047857">Agreement: < 10 mins</text>

  <!-- Step 5: Core Banking Automated Payment -->
  <rect x="830" y="530" width="135" height="65" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2" />
  <text x="840" y="552" class="node-text">Core Banking API</text>
  <text x="840" y="567" class="node-subtext">Automated Payment Rails</text>
  <text x="840" y="582" font-family="sans-serif" font-size="9" font-weight="700" fill="#15803d">Disbursed in < 15 mins</text>

  <!-- End Node -->
  <circle cx="900" cy="115" r="20" fill="#10b981" stroke="#047857" stroke-width="2" />
  <text x="886" y="119" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff">END</text>
  <text x="860" y="145" font-family="sans-serif" font-size="9" font-weight="700" fill="#047857">TAT: 1.8 Days</text>

  <!-- Connecting Lines -->
  <line x1="237" y1="145" x2="237" y2="172" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)" />
  <path d="M 295,210 L 395,210 L 395,267" fill="none" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)" />
  <path d="M 460,305 L 570,305 L 570,347" fill="none" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)" />
  <line x1="610" y1="390" x2="637" y2="390" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)" />
  <path d="M 570,425 L 570,437" fill="none" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-green)" />
  <path d="M 640,472 L 717,472 L 717,428" fill="none" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)" />
  <line x1="717" y1="365" x2="717" y2="153" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)" />
  <path d="M 790,115 L 872,115" fill="none" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)" />
  <path d="M 717,145 L 717,562 L 822,562" fill="none" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)" />
</svg>
