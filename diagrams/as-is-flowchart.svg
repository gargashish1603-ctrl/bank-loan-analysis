<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .swimlane-label { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
      .node-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 11px; fill: #1e293b; font-weight: 500; }
      .node-subtext { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 9px; fill: #64748b; }
      .tag-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 9px; font-weight: 600; fill: #ef4444; }
      .edge-label { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 9px; fill: #dc2626; font-weight: 600; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Header -->
  <rect width="1000" height="650" fill="#f8fafc" rx="8" />
  <text x="30" y="35" class="title">NovaBank — AS-IS Personal Loan Origination Process (Baseline: 5.0 Days TAT)</text>
  <text x="30" y="55" class="subtitle">Illustrative assumptions for portfolio case study — not real bank data | Red borders highlight manual bottlenecks & rework loops</text>

  <!-- Swimlane Backgrounds -->
  <!-- Lane 1: Customer -->
  <rect x="20" y="70" width="960" height="85" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <rect x="20" y="70" width="130" height="85" fill="#f1f5f9" stroke="#e2e8f0" />
  <text x="30" y="115" class="swimlane-label">1. Customer</text>

  <!-- Lane 2: Branch RM / Ops -->
  <rect x="20" y="155" width="960" height="85" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <rect x="20" y="155" width="130" height="85" fill="#f1f5f9" stroke="#e2e8f0" />
  <text x="30" y="200" class="swimlane-label">2. Branch RM / Ops</text>

  <!-- Lane 3: Loan Operations -->
  <rect x="20" y="240" width="960" height="95" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <rect x="20" y="240" width="130" height="95" fill="#f1f5f9" stroke="#e2e8f0" />
  <text x="30" y="290" class="swimlane-label">3. Loan Operations</text>

  <!-- Lane 4: KYC & Compliance -->
  <rect x="20" y="335" width="960" height="75" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <rect x="20" y="335" width="130" height="75" fill="#f1f5f9" stroke="#e2e8f0" />
  <text x="30" y="375" class="swimlane-label">4. KYC / Compliance</text>

  <!-- Lane 5: Credit & Underwriting -->
  <rect x="20" y="410" width="960" height="110" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <rect x="20" y="410" width="130" height="110" fill="#f1f5f9" stroke="#e2e8f0" />
  <text x="30" y="465" class="swimlane-label">5. Credit / Underwriting</text>

  <!-- Lane 6: Disbursement & Core -->
  <rect x="20" y="520" width="960" height="85" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <rect x="20" y="520" width="130" height="85" fill="#f1f5f9" stroke="#e2e8f0" />
  <text x="30" y="565" class="swimlane-label">6. Disbursement & Core</text>

  <!-- Nodes & Process Flow -->
  <!-- Step 1: Customer Form -->
  <rect x="170" y="85" width="100" height="55" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
  <text x="180" y="105" class="node-text">Fill Paper/Web</text>
  <text x="180" y="120" class="node-subtext">Static form (18% errors)</text>

  <!-- Step 2: Upload Docs -->
  <rect x="290" y="85" width="105" height="55" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
  <text x="298" y="105" class="node-text">Upload Documents</text>
  <text x="298" y="120" class="node-subtext">Unchecked PDFs/Images</text>

  <!-- Step 3: RM Re-keying -->
  <rect x="290" y="170" width="105" height="55" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
  <text x="300" y="190" class="node-text">Re-key into CRM</text>
  <text x="300" y="205" class="node-subtext">Manual typing</text>

  <!-- Step 4: Loan Ops Manual Review -->
  <rect x="420" y="255" width="115" height="60" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
  <text x="430" y="275" class="node-text">Manual Doc Review</text>
  <text x="430" y="290" class="node-subtext">35 min/app inspection</text>
  <rect x="425" y="298" width="105" height="13" fill="#fee2e2" rx="3" />
  <text x="430" y="308" class="tag-text">BOTTLENECK: +7.3h</text>

  <!-- Gateway: Decision Docs Complete -->
  <polygon points="575,285 605,255 635,285 605,315" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" />
  <text x="590" y="288" font-family="sans-serif" font-size="10" font-weight="700" fill="#b45309">Docs?</text>

  <!-- Rework Path: Loop back to Customer -->
  <path d="M 605,255 L 605,112 L 405,112" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-red)" />
  <text x="612" y="180" class="edge-label">NO (35% Rework)</text>
  <text x="612" y="193" class="edge-label">Email notification (+48h)</text>

  <!-- Step 5: KYC Verification -->
  <rect x="560" y="348" width="115" height="50" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
  <text x="570" y="368" class="node-text">Manual KYC & AML</text>
  <text x="570" y="382" class="node-subtext">Portal copy-paste</text>

  <!-- Step 6: Credit Excel Assessment -->
  <rect x="560" y="425" width="115" height="50" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
  <text x="570" y="445" class="node-text">Manual Bureau DTI</text>
  <text x="570" y="459" class="node-subtext">Excel calculation sheet</text>

  <!-- Step 7: Underwriter Queue -->
  <rect x="710" y="425" width="125" height="65" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
  <text x="720" y="445" class="node-text">FIFO Underwriting</text>
  <text x="720" y="460" class="node-subtext">100% manual review</text>
  <rect x="715" y="468" width="115" height="15" fill="#fee2e2" rx="3" />
  <text x="720" y="479" class="tag-text">BOTTLENECK: +9.5h Wait</text>

  <!-- Step 8: Paper Agreement -->
  <rect x="710" y="85" width="125" height="55" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
  <text x="720" y="105" class="node-text">Physical Wet Sign</text>
  <text x="720" y="120" class="node-subtext">Branch visit (+24h delay)</text>

  <!-- Step 9: Core Banking Batch -->
  <rect x="860" y="535" width="105" height="55" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" />
  <text x="870" y="555" class="node-text">Batch Payment</text>
  <text x="870" y="570" class="node-subtext">EOD Core Banking release</text>

  <!-- End Node -->
  <circle cx="912" cy="112" r="18" fill="#e2e8f0" stroke="#64748b" stroke-width="2" />
  <text x="900" y="116" font-family="sans-serif" font-size="10" font-weight="700" fill="#334155">END</text>

  <!-- Connecting Arrows -->
  <line x1="270" y1="112" x2="282" y2="112" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="342" y1="140" x2="342" y2="162" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 395,197 L 477,197 L 477,247" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="535" y1="285" x2="567" y2="285" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 605,315 L 605,340" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="617" y1="398" x2="617" y2="417" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="675" y1="450" x2="702" y2="450" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="772" y1="425" x2="772" y2="148" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 835,112 L 912,112 L 912,527" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
</svg>
